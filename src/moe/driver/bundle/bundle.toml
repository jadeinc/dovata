# The MoE expert-offload bundle: this capability's delta to llama.cpp.
#
# A bundle is how a capability customizes the inference engine without anyone
# forking it. The sys crate's build.rs stages a copy of the pinned upstream tree,
# applies the patches named here, and points cmake at the copy — so the submodule
# stays a clean checkout of stock llama.cpp and the delta is reviewable in this
# repo, per capability, instead of living invisibly in a fork's history.

name = "moe"

# The upstream commit the series was generated against and last verified on.
# tools/scripts/check-bundles.py compares this to the submodule's actual pin and
# runs `git apply --check` for every patch, so the two cannot drift silently.
#
# Bumping upstream is a separate job from de-forking: `build_moe_ffn` and the
# `ggml_cuda_compute_forward` switch are both places upstream moves, so expect to
# regenerate rather than rebase. The check script is what tells you which.
upstream = "52b3df0023659b142ce29f75c7a82cf437769c33"

# Applied in order with `git apply`. A failure is a hard build error, never a
# warning: the seam is a no-op when the driver is inactive, so a half-applied
# series produces a build that looks healthy and silently runs stock.
patches = [
    "patches/0001-llama-graph-build-moe-ffn-seam.patch",
    "patches/0002-ggml-cuda-custom-op-pager-dispatch.patch",
    "patches/0003-cmake-compile-and-link-the-driver.patch",
]

# Passed to cmake as -D. `JADE_MOE_DRIVER_DIR` is filled in by build.rs with the
# absolute path to this bundle's driver sources; it cannot be written here because
# it depends on where cargo put things. The patched CMakeLists refuse to configure
# if it is unset, so a bundle wired up wrong fails at cmake time rather than
# producing a libllama with no driver in it.
[defines]
JADE_MOE_DRIVER = "ON"

# Where the capability's native sources live, relative to this file. build.rs
# resolves it to an absolute path and passes it as JADE_MOE_DRIVER_DIR.
[sources]
driver_dir = ".."
