[package]
name = "bundle-kit"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Reads capability bundles (a patch series + cmake defines) for the llama.cpp build. A build-dependency of llama-cpp-sys-2."

[lib]
name = "bundle_kit"
path = "src/lib.rs"

# A real crate rather than more functions inside the sys crate's 1200-line build.rs,
# for one reason: build scripts cannot be unit-tested, and none of the build logic in
# this repo is. The parts that decide *whether a patch is allowed to apply* are exactly
# the parts worth testing, so they live somewhere `cargo test` can reach them.
[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
