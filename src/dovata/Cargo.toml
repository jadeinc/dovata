[package]
name = "dovata"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "JADE OS inference engine — the local llama.cpp provider, loaded in-process as an ovata-infer-protocol provider .so"

[lib]
name = "dovata"
path = "src/lib.rs"
# cdylib is what ships: the engine loaded straight into a Jade program as a provider
# package, the same way `echo` is. rlib so the tests and the packaging xtask can link
# the same code.
crate-type = ["cdylib", "rlib"]

[features]
# Every capability is on by default, so a plain `cargo build` produces the artifact
# that ships. The features exist to make each capability's boundary explicit and
# checkable — if a capability can't be switched off, its edges aren't real — and to
# give the llama.cpp bundles (src/infer-engine/*/bundle/) one switch that gates the
# Rust half and the C++ patch series together.
default = ["compose", "batch", "moe"]

# GPU offload on NVIDIA hardware for the in-process engine (forwarded to the vendored
# llama-cpp-2). No-op on non-Linux targets, where the engine isn't compiled.
cuda = ["llama-cpp-2/cuda"]

# Long-context answering: the KV-composition engine (src/engine/compose.rs), its
# request dispatch (src/engine/rlm.rs), and the pure corpus/question split
# (src/route.rs). Turn it off and an over-context prompt is refused with an Error
# frame naming the capability, rather than truncated to fit — a wrong answer from a
# silently shortened prompt is worse than no answer.
compose = []

# Continuous batching: the pure multi-sequence scheduler (src/sched.rs) and its
# llama-bound driver (src/engine/concurrency.rs). Nothing calls the driver today —
# see src/dovata/src/engine/README.md — so turning this off changes no behaviour,
# only what compiles. The pure scheduler stays well tested either way.
batch = []

# MoE expert offload: the expert_order loader, the FFI to the C driver, and (with
# the bundle wired up in the sys crate) the llama.cpp graph seam. Turn it off and
# JADE_MOE_DRIVER=1 fails the load instead of being ignored.
moe = []

[dependencies]
# `version` alongside `path` is not redundant: cargo checks the submodule's actual
# version against it, so rolling src/protocol back below the floor fails to resolve
# instead of failing to compile somewhere confusing. 0.5.0 is the floor because the
# provider ABI gained `ovata_provider_protocol_version` there, which packaging reads.
ovata-infer-protocol = { path = "../protocol", version = ">=0.5.0" }
# GGUF header reader for the startup preflight (src/preflight.rs). Pure and
# dependency-free, so it does not drag llama.cpp into the non-Linux build.
gguf = { path = "../gguf" }
# Raw malloc/free for the Jade package boundary: the compiler frees the tree we
# return, and its allocator is libc's, not Rust's. See src/jade_pkg.rs.
libc = "0.2"
serde_json = { version = "1", features = ["std"] }
# The folded-in model profile module (was the jade-model-profile crate): TOML profiles.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# The local llama.cpp engine (src/engine) is Linux-only: it links the vendored
# infer-engine. Gated so the pure core still builds and tests on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
llama-cpp-2 = { path = "../infer-engine/api" }
llama-cpp-sys-2 = { path = "../infer-engine/ffi" }
encoding_rs = "0.8"
