[package]
name = "dovata"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "JADE OS inference engine — the local llama.cpp provider, loaded in-process as an ovata-infer-protocol provider .so"

[lib]
name = "dovata"
path = "src/lib.rs"
# cdylib is what ships: the engine loaded straight into a Jade program as a provider
# package, the same way `echo` is. rlib so the tests and the packaging xtask can link
# the same code.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# GPU offload on NVIDIA hardware for the in-process engine (forwarded to the vendored
# llama-cpp-2). No-op on non-Linux targets, where the engine isn't compiled.
cuda = ["llama-cpp-2/cuda"]

[dependencies]
# `version` alongside `path` is not redundant: cargo checks the submodule's actual
# version against it, so rolling src/protocol back below the floor fails to resolve
# instead of failing to compile somewhere confusing. 0.5.0 is the floor because the
# provider ABI gained `ovata_provider_protocol_version` there, which packaging reads.
ovata-infer-protocol = { path = "../protocol", version = ">=0.5.0" }
# GGUF header reader for the startup preflight (src/preflight.rs). Pure and
# dependency-free, so it does not drag llama.cpp into the non-Linux build.
gguf = { path = "../gguf" }
# Raw malloc/free for the Jade package boundary: the compiler frees the tree we
# return, and its allocator is libc's, not Rust's. See src/jade_pkg.rs.
libc = "0.2"
serde_json = { version = "1", features = ["std"] }
# The folded-in model profile module (was the jade-model-profile crate): TOML profiles.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# The local llama.cpp engine (src/engine) is Linux-only: it links the vendored
# infer-engine. Gated so the pure core still builds and tests on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
llama-cpp-2 = { path = "../infer-engine/api" }
llama-cpp-sys-2 = { path = "../infer-engine/ffi" }
encoding_rs = "0.8"
