[package]
name = "gguf"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure-Rust GGUF metadata reader — answers what llama.cpp will see in a model file, without llama.cpp"

[lib]
name = "gguf"
path = "src/lib.rs"

[[bin]]
name = "gguf-inspect"
path = "src/main.rs"

# No dependencies on purpose. The whole point of this crate is that it reads a
# GGUF header on any machine — macOS laptop included — without the vendored
# llama.cpp, without CUDA, and without a model resident in RAM.
[dependencies]
