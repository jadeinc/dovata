name: publish-providers

# Build the Jade packages (the remote providers anthropic/openai, and the dovata
# local-model profile qwen3-coder-30b) to native .so for each supported platform and
# publish them so they can be installed with `jade pkg add --url`. The .so's are served
# at https://www.jadelang.org/<name>-<platform>.so — the pipeline uploads them to a
# release on the public `jade` repo (the transfer medium), then triggers that repo's
# Pages deploy, which injects them into the site.
#
# Consumer install:
#   jade pkg add anthropic       --url 'https://www.jadelang.org/anthropic-{platform}.so'       --version <v>
#   jade pkg add qwen3_coder_30b --url 'https://www.jadelang.org/qwen3-coder-30b-{platform}.so' --version <v>
#
# Requires one secret: JADE_REPO_TOKEN — a token with Contents:write + Actions:write
# on github.com/joericks1998/jade (to upload the release + trigger its Pages deploy).
#
# Triggers on the same `v*` release tag as the daemon (release.yml), so one tag ships
# everything: the daemon to S3 and every Jade package to jadelang.org. The package
# version defaults to the tag (minus the leading `v`); a manual run can override it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (semver, e.g. 0.1.0). Defaults to the tag for a tag push."
        required: false
        default: ""

permissions:
  contents: read

env:
  # Jade toolchain used to compile the .jde libraries (kept in lock-step with the
  # release workflow's pin).
  JADE_VERSION: "v1.1.23"
  # Jade packages to publish, one "<name> <source.jde>" per line. <name> is the
  # published .so basename (served as jadelang.org/<name>-<platform>.so); the import
  # name (`use ...`) is the consumer's choice at `jade pkg add`. Includes the remote
  # providers and the dovata local-model profile (tool-call parsing).
  PACKAGES: |
    anthropic anthropic/anthropic.jde
    openai openai/openai.jde
    qwen3-coder-30b dovata/profiles/qwen3-coder-30b.jde
  # Public repo whose GitHub Pages serves jadelang.org, and where the built .so's are
  # staged for the Pages deploy to inject.
  PAGES_REPO: "joericks1998/jade"
  # Rolling release tag on PAGES_REPO used purely to transfer the built artifacts.
  TRANSFER_TAG: "providers-latest"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            jade_archive: jade-linux-x86_64.tar.gz
          - os: macos-14
            platform: darwin-aarch64
            jade_archive: jade-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Install the pinned jade toolchain (binary + lib/*.a runtime archives that
      # `jade build` links) under a prefix so jade resolves <prefix>/lib/jade.
      - name: Install jade ${{ env.JADE_VERSION }}
        run: |
          set -euo pipefail
          base="https://github.com/joericks1998/jade/releases/download/${JADE_VERSION}"
          archive="${{ matrix.jade_archive }}"
          tmp="$(mktemp -d)"
          # Download under the archive's real name so `sha256sum -c` (which reads the
          # filename from checksums.txt) can find it.
          curl -fsSL "${base}/${archive}"    -o "${tmp}/${archive}"
          curl -fsSL "${base}/checksums.txt" -o "${tmp}/checksums.txt"
          if command -v sha256sum >/dev/null 2>&1; then SUM="sha256sum"; else SUM="shasum -a 256"; fi
          ( cd "${tmp}" && grep "${archive}" checksums.txt | $SUM -c - )
          prefix="${HOME}/jade-toolchain"
          mkdir -p "${prefix}/bin" "${prefix}/lib/jade"
          tar -xzf "${tmp}/${archive}" -C "${tmp}"
          install -m 0755 "${tmp}/jade" "${prefix}/bin/jade"
          if [ -d "${tmp}/lib" ]; then cp "${tmp}"/lib/*.a "${prefix}/lib/jade/"; fi
          echo "${prefix}/bin" >> "$GITHUB_PATH"

      - name: Build Jade packages (${{ matrix.platform }})
        run: |
          set -euo pipefail
          jade --version
          mkdir -p out
          printf '%s\n' "$PACKAGES" | while read -r name src; do
            [ -z "$name" ] && continue
            jade build "$src" --lib -o "out/${name}-${{ matrix.platform }}.so" || exit 1
            echo "built out/${name}-${{ matrix.platform }}.so"
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: providers-${{ matrix.platform }}
          path: out/*.so
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect built .so's
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: providers-*
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.so > checksums.txt
          echo "Published artifacts:"; ls -l; echo; cat checksums.txt

      # Stage the artifacts on the public jade repo (transfer medium) and trigger its
      # Pages deploy, which injects them so they are served at jadelang.org/<name>.so.
      - name: Stage to ${{ env.PAGES_REPO }} and trigger Pages deploy
        env:
          GH_TOKEN: ${{ secrets.JADE_REPO_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          # Package version: the manual input if given, else the tag minus its leading
          # `v` (so a `v1.3.0` release publishes package version 1.3.0); a manual run
          # with no input gets a dev marker (VERSION is metadata, not baked into the .so).
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)           VERSION="0.0.0-dev" ;;
            esac
          fi
          echo "Publishing packages at version ${VERSION}"
          # Ensure the rolling transfer release exists (idempotent).
          gh release view "$TRANSFER_TAG" --repo "$PAGES_REPO" >/dev/null 2>&1 || \
            gh release create "$TRANSFER_TAG" --repo "$PAGES_REPO" --prerelease \
              --title "Provider packages (rolling)" \
              --notes "Latest built anthropic/openai provider .so packages. Served at https://www.jadelang.org/<name>-<platform>.so. Auto-published by dovata; do not edit by hand."
          gh release upload "$TRANSFER_TAG" --repo "$PAGES_REPO" --clobber dist/*.so dist/checksums.txt
          echo "Uploaded provider .so's (version ${VERSION}) to ${PAGES_REPO}:${TRANSFER_TAG}"
          # Kick the Pages deploy so the site picks up the new .so's.
          gh workflow run deploy-docs.yml --repo "$PAGES_REPO" \
            || echo "::warning::could not trigger deploy-docs on ${PAGES_REPO} — run it manually to publish"
