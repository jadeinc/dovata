name: release-dovata

# Builds the dovata inference engine with the CUDA backend (Linux x86_64) and the
# native `echo` reference provider, and publishes the bundle so the JADE OS image can
# install a prebuilt engine instead of compiling it on the target.
#
# What ships is `dovata-<arch>.so`, a provider package a Jade program loads in-process
# (jadelang -> dovata.so -> nvidia.ko). There is no daemon binary and no socket.
#
# The remote providers (anthropic/openai) are NOT in this OS bundle — they are
# pure-Jade .so packages published separately to jadelang.org (see publish-providers.yml).
#
# The actual build + staging logic lives in the `packaging` xtask
# (`cargo run -p packaging -- release`), so this workflow only sets up the environment
# and ships whatever packaging drops into dist/.
#
# Triggers:
#   * push of a tag matching v*  → builds + creates a GitHub Release with the bundle
#     attached (this is the real "release").
#   * manual run (workflow_dispatch) → builds + uploads the bundle as a workflow
#     artifact only (no Release is created). Use for ad-hoc / test builds.
#
# Runtime requirements on the booted OS:
#   The CUDA runtime (cudart/cublas) is linked STATICALLY into the engine library
#   (see llama-cpp-sys-2 build.rs), so the rootfs does NOT need the CUDA toolkit.
#   It needs only: libcuda.so.1 (shipped by the NVIDIA driver), glibc,
#   libstdc++.so.6, and libgomp.so.1 (OpenMP). The model is provided separately
#   at $JADE_MODEL_PATH (default /jade/inference/model.gguf).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      cuda_archs:
        description: "CUDA compute arch(es), semicolon-separated (A10G=86, A100=80, L4/Ada=89)"
        required: false
        default: "86"

permissions:
  contents: write # needed to create the Release and upload assets

env:
  # CUDA toolkit version installed in CI. The binary statically links this
  # toolkit's cudart/cublas; the target only needs a driver new enough for it.
  CUDA_VERSION: "12.6.3"
  # Compute capability the GPU kernels are built for. CMake reads CUDAARCHS as
  # the default for CMAKE_CUDA_ARCHITECTURES (llama-cpp-sys-2 doesn't set it,
  # and there's no GPU on the runner for auto-detection — so we must).
  CUDAARCHS: "${{ github.event.inputs.cuda_archs || '86' }}"

jobs:
  build-cuda:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # llama.cpp is a vendored git submodule (src/infer-engine/ffi/llama.cpp
          # → our fork @ pinned commit), not a bundled crates.io copy. The CUDA
          # build compiles it from source, so it must be checked out here or the
          # build hits an empty directory.
          submodules: recursive

      # CUDA toolkit (~3.5GB installed) + the llama.cpp cmake build can exhaust
      # the runner's ~14GB of free space. Reclaim space from preinstalled SDKs.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false # keep apt fast; we install our own toolchain
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # cmake + a C/C++ toolchain for the vendored llama.cpp build; clang +
          # libclang for llama-cpp-sys-2's bindgen step. gcc-13 is the newest
          # host compiler CUDA 12.6's nvcc accepts.
          sudo apt-get install -y -qq \
            build-essential cmake pkg-config \
            clang libclang-dev llvm \
            gcc-13 g++-13
          echo "CUDAHOSTCXX=/usr/bin/g++-13" >> "$GITHUB_ENV"
          echo "CC=gcc-13"  >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install CUDA toolkit ${{ env.CUDA_VERSION }}
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: "local" # full local installer — guarantees the static libs
          linux-local-args: '["--toolkit"]' # toolkit only, skip the driver/samples

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The compiled llama.cpp (incl. the MoE driver sources) is cached under the
      # key below. That key MUST include the llama.cpp submodule commit — without
      # it, repointing the submodule (e.g. to a new fork commit) reuses a stale
      # cached build that never recompiles the changed C++/CUDA sources.
      - name: Resolve llama.cpp submodule SHA (cache key)
        id: llama_sha
        run: echo "sha=$(git -C src/infer-engine/ffi/llama.cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo + build (incl. compiled llama.cpp)
        uses: Swatinem/rust-cache@v2
        with:
          key: cuda-${{ env.CUDA_VERSION }}-arch-${{ env.CUDAARCHS }}-llama-${{ steps.llama_sha.outputs.sha }}

      - name: Sanity — verify nvcc on PATH
        run: |
          echo "CUDA_PATH=$CUDA_PATH"
          nvcc --version

      # Cheap correctness gate on the pure code before the long CUDA compile, so
      # we never cut a release from a broken library/protocol.
      - name: Test pure crates
        run: |
          cargo test -p ovata-infer-protocol
          cargo test -p gguf
          cargo test -p dovata --lib
          # Also with every capability compiled out. The gates are only real if the
          # crate still builds and passes without them, and this is where a stale
          # `#[cfg(feature = ...)]` left over from moving code shows up — a build with
          # defaults on never exercises the other arm.
          cargo test -p dovata --lib --no-default-features

      # Build the engine (--features cuda) + the provider .so packages and stage the
      # whole bundle into dist/ (engine asset `dovata-<arch>.so` + .sha256, provider
      # .so's, manifest.json). All the real logic lives in the packaging xtask.
      - name: Build + package (packaging xtask)
        run: cargo run -p packaging -- release --cuda

      - name: Inspect bundle
        id: bundle
        run: |
          test -f dist/manifest.json || { echo "::error::packaging produced no manifest"; exit 1; }
          NAME="$(jq -r '.engine.asset' dist/manifest.json)"
          test -n "$NAME" && test "$NAME" != "null" || { echo "::error::no engine asset in manifest"; exit 1; }
          echo "Bundle contents:"; ls -l dist
          echo "Linked runtime libs (target must provide these):"
          ldd "dist/$NAME" || true
          echo "asset_name=$NAME" >> "$GITHUB_OUTPUT"

      # Manual runs: keep the whole bundle as a downloadable artifact, no Release.
      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.asset_name }}-bundle
          path: dist/*
          if-no-files-found: error

      # Tag pushes: create/update the GitHub Release and attach the whole bundle.
      - name: Publish Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Tag pushes: also mirror the bundle to S3 so the bootloader / other consumers
      # can pull from the bucket instead of GitHub Releases. Auth is via long-lived
      # access keys (repo secrets); bucket + region are repo variables.
      - name: Configure AWS credentials (tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Upload bundle to S3 (tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUCKET: ${{ vars.AWS_S3_BUCKET }}
          TAG: ${{ github.ref_name }}
        run: |
          test -n "$BUCKET" || { echo "::error::AWS_S3_BUCKET variable is not set"; exit 1; }

          # 1) Generic "latest" prefix — overwritten in place so consumers (the
          #    installer) can always pull the newest engine + providers from a stable
          #    path. The engine lands at artifacts/dovata-<arch>.so. Safe
          #    to overwrite because every release is also archived immutably under
          #    artifacts/versions/<tag>/ below.
          aws s3 cp dist/ "s3://${BUCKET}/artifacts/" --recursive --no-progress

          # 2) Immutable, tag-named archive copy — one per release, never overwritten,
          #    so any prior version stays retrievable by git tag even after the generic
          #    prefix moves forward.
          aws s3 cp dist/ "s3://${BUCKET}/artifacts/versions/${TAG}/" --recursive --no-progress

          echo "Uploaded latest  → s3://${BUCKET}/artifacts/"
          echo "Archived release → s3://${BUCKET}/artifacts/versions/${TAG}/"
