[package]
name = "jaded"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "JADE OS inference daemon — serves jade-protocol inference requests over a Unix socket"

[lib]
name = "jaded"
path = "src/lib.rs"

[[bin]]
name = "jaded"
path = "src/main.rs"

[features]
default = []
# Full inference backend with llama.cpp — required for production boot (Linux only)
inference = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2", "dep:encoding_rs", "dep:io-uring"]
# GPU offload on NVIDIA hardware
cuda = ["inference", "llama-cpp-2/cuda"]

[dependencies]
jade-protocol = { path = "../jade-protocol" }
serde_json = { version = "1", features = ["std"] }
llama-cpp-2 = { version = "0.1", optional = true }
llama-cpp-sys-2 = { version = "0.1", optional = true }
encoding_rs = { version = "0.8", optional = true }
io-uring = { version = "0.6", optional = true }
