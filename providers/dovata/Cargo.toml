[package]
name = "ovata-provider-dovata"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Local llama.cpp provider for the ovata inference protocol — a loadable .so (Linux)"

[lib]
# cdylib: the loadable provider .so the daemon dlopens.
# rlib:   so the crate's own (Linux-only) #[test]s can build against it.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# GPU offload on NVIDIA hardware (forwarded to the vendored llama-cpp-2).
cuda = ["llama-cpp-2/cuda"]

[dependencies]
ovata-infer-protocol = { path = "../../ovata-infer-protocol" }
# The pure, platform-independent core (config, cache, control, prompt, route, moe,
# sched) lives in the daemon lib and is reused here.
dovata = { path = "../../dovata" }
jade-model-profile = { path = "../../jade-model-profile" }
serde_json = { version = "1", features = ["std"] }
# Vendored in-tree llama-cpp-rs (see workspace Cargo.toml notes / .gitmodules).
llama-cpp-2 = { path = "../../llama-cpp/api" }
llama-cpp-sys-2 = { path = "../../llama-cpp/ffi" }
encoding_rs = "0.8"
