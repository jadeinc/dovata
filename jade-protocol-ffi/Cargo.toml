[package]
name = "jade-protocol-ffi"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "C-ABI streaming client for the jade inference protocol (builds jade-protocol.so)"

[lib]
# Produces lib{jade_protocol}.{so,dylib} — the shared library the native `use llm`
# package links/loads. `rlib` is kept so the pure parser unit-tests can run.
name = "jade_protocol"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Aliased to `protocol` so it doesn't collide with this crate's own lib name.
protocol = { path = "../jade-protocol", package = "jade-protocol" }
serde_json = "1"

[build-dependencies]
cbindgen = "0.27"
