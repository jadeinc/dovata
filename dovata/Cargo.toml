[package]
name = "dovata"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "JADE OS inference daemon — serves ovata-infer-protocol inference requests over a Unix socket"

[lib]
name = "dovata"
path = "src/lib.rs"

[[bin]]
name = "dovata"
path = "src/main.rs"

[features]
default = []
# Full inference backend with llama.cpp — required for production boot (Linux only)
inference = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2", "dep:encoding_rs", "dep:io-uring"]
# GPU offload on NVIDIA hardware
cuda = ["inference", "llama-cpp-2/cuda"]

[dependencies]
ovata-infer-protocol = { path = "../ovata-infer-protocol" }
jade-model-profile = { path = "../jade-model-profile" }
serde_json = { version = "1", features = ["std"] }
# Host-side provider plugin loading (dlopen the provider .so packages).
libloading = "0.8"
# Vendored in-tree (llama-cpp/ = llama-cpp-rs @ 0.1.150) with its llama.cpp
# submodule repointed to our fork joericks1998/llama.cpp @ 9e3b928. See .gitmodules.
llama-cpp-2 = { path = "../llama-cpp/api", optional = true }
llama-cpp-sys-2 = { path = "../llama-cpp/ffi", optional = true }
encoding_rs = { version = "0.8", optional = true }
io-uring = { version = "0.6", optional = true }
