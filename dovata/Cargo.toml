[package]
name = "dovata"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "JADE OS inference daemon — serves ovata-infer-protocol inference requests over a Unix socket"

[lib]
name = "dovata"
path = "src/lib.rs"

[[bin]]
name = "dovata"
path = "src/main.rs"

[dependencies]
ovata-infer-protocol = { path = "../ovata-infer-protocol" }
# The pure core still uses profile chat templates (dovata::prompt).
jade-model-profile = { path = "../jade-model-profile" }
serde_json = { version = "1", features = ["std"] }
# Host-side provider plugin loading (dlopen the provider .so packages). The llama.cpp
# backend now lives in provider-dovata, not here — this binary links no model backend.
libloading = "0.8"
