[package]
name = "dovata"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "JADE OS inference daemon — host + local llama.cpp engine, serving ovata-infer-protocol over a Unix socket"

[lib]
name = "dovata"
path = "src/lib.rs"

[[bin]]
name = "dovata"
path = "src/main.rs"

[features]
default = []
# GPU offload on NVIDIA hardware for the in-process engine (forwarded to the vendored
# llama-cpp-2). No-op on non-Linux targets, where the engine isn't compiled.
cuda = ["llama-cpp-2/cuda"]

[dependencies]
ovata-infer-protocol = { path = "../protocol" }
serde_json = { version = "1", features = ["std"] }
# The folded-in model profile module (was the jade-model-profile crate): TOML profiles.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Host-side loading of the remote provider .so packages (anthropic/openai). The local
# llama.cpp backend is compiled in (see the Linux target deps below), not dlopened.
libloading = "0.8"

# The local llama.cpp engine (src/engine) is Linux-only: it links the vendored
# infer-engine. Gated so the host still builds on macOS without a model backend.
[target.'cfg(target_os = "linux")'.dependencies]
llama-cpp-2 = { path = "../infer-engine/api" }
llama-cpp-sys-2 = { path = "../infer-engine/ffi" }
encoding_rs = "0.8"
