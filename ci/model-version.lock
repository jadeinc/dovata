# JADE OS inference model — pinned production build inputs.
#
# This file is the SINGLE SOURCE OF TRUTH for what model gets quantized and
# published to s3://jade-os-release-bucket/models/model.gguf. Everything is
# pinned so a build is byte-for-byte reproducible. Bumping a value here is the
# intended way to cut a new model release; then run the pipeline by hand on the
# EC2 GPU box: `python3 tools/ec2/quantize.py` (drives tools/scripts/quantize-model.py).
#
# It is plain `KEY=VALUE` (no spaces, no quotes) so it can be parsed as env
# defaults by tools/scripts/quantize-model.py AND read line-by-line by the workflow.

# --- Source model -----------------------------------------------------------
# Qwen3-Coder-30B-A3B-Instruct: a 30B-total / ~3B-active MoE coder model.
# HF_REVISION is a full commit sha (NOT a branch/tag) so "latest" can never
# silently change what we ship.
HF_REPO=Qwen/Qwen3-Coder-30B-A3B-Instruct
HF_REVISION=b2cff646eb4bb1d68355c01b18ae02e7cf42d120

# --- Quantization -----------------------------------------------------------
# Q4_K_M is a mixed K-quant scheme — do not hand-tune the per-tensor mix.
# We DO drive it with an importance matrix (imatrix) calibrated on code
# (ci/calib-code.txt), which meaningfully improves Q4 quality for a coder model.
QUANT=Q4_K_M
IMATRIX_CHUNKS=100

# --- llama.cpp toolchain ----------------------------------------------------
# The commit is NOT recorded here. It is read from the src/llama/bindings-sys/llama.cpp
# submodule at run time, because that submodule is what the engine builds from.
# (The engine links that commit plus its capability bundles' patches; those patches
# are forbidden from touching the converter or quantizer, so one pin still serves
# both. tools/scripts/check-bundles.py enforces it.)
# It used to be a LLAMA_CPP_COMMIT line, hand-copied from the submodule and updated
# by hand alongside it, with nothing checking the two agreed — and quantizing with a
# different commit than the daemon links is how you publish a GGUF the daemon cannot
# load. One source, no copy, nothing to keep in sync.
#
# Only the repo stays configurable. We fetch the quantize/imatrix tools from ggml-org
# rather than our fork: the source is identical at the pinned commit, and ggml-org
# keeps tools we may later strip from the daemon fork.
LLAMA_CPP_REPO=https://github.com/ggml-org/llama.cpp

# --- GPU offload ------------------------------------------------------------
# CUDA compute arch the imatrix/quantize tools are built for (A10G=86, A100=80,
# L4/Ada=89). Matches the release-dovata default. Overridable via CUDAARCHS.
CUDAARCHS=86
