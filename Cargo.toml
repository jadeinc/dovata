[workspace]
members = [
    # The wire protocol lives in its own public repo (git submodule) so the Jade
    # language, which is public, can depend on it too — a public repo cannot take
    # a git dependency on this private one. Both sides build the same definition.
    "ovata-infer-protocol",
    "jade-model-profile",
    "jaded",
]
# Vendored llama-cpp-rs (0.1.150), in-tree at llama-cpp/, is its own workspace —
# its crates inherit from their own [workspace.dependencies]/[lints]. Exclude it
# here so it stays an independent workspace root; jaded uses its crates via path deps.
exclude = ["llama-cpp"]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["JADE OS Contributors"]
license = "MIT"
