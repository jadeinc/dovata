[workspace]
members = [
    "jade-protocol",
    "jade-model-profile",
    "jaded",
]
# Vendored llama-cpp-rs (0.1.150), in-tree at llama-cpp/, is its own workspace —
# its crates inherit from their own [workspace.dependencies]/[lints]. Exclude it
# here so it stays an independent workspace root; jaded uses its crates via path deps.
exclude = ["llama-cpp"]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["JADE OS Contributors"]
license = "MIT"
