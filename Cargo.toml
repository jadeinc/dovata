[package]
name = "dovata"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "JADE OS inference engine — the local llama.cpp provider, loaded in-process as an ovata-infer-protocol provider .so"

[lib]
name = "dovata"
path = "src/lib.rs"
# cdylib is what ships: the engine loaded straight into a Jade program as a provider
# package, the same way `echo` is. rlib so the tests and the packaging xtask can link
# the same code.
crate-type = ["cdylib", "rlib"]

# `gguf-inspect` vets a model file — architecture, hparams, whether any profile matches
# — without llama.cpp, so it runs on a laptop before a GPU box ever sees the model. It
# is a bin of this package rather than its own crate because the reader it wraps is
# `src/gguf/`, a plain module of this engine: `load/preflight.rs` is its only other
# caller, and a crate boundary between them bought nothing but a second manifest.
[[bin]]
name = "gguf-inspect"
path = "src/gguf/main.rs"

# ── Capabilities ──────────────────────────────────────────────────────────────
[features]
# Every capability is on by default, so a plain `cargo build` produces the artifact
# that ships. The features exist to make each capability's boundary explicit and
# checkable — if a capability can't be switched off, its edges aren't real — and to
# give the llama.cpp bundles (src/moe/driver/bundle/) one switch that gates the
# Rust half and the C++ patch series together.
default = ["compose", "batch", "moe"]

# GPU offload on NVIDIA hardware for the in-process engine (forwarded to the vendored
# llama-cpp-2). No-op on non-Linux targets, where the engine isn't compiled.
cuda = ["llama-cpp-2/cuda"]

# Long-context answering: the KV-composition engine and its request dispatch
# (src/compose/), plus the pure corpus/question split. Turn it off and an over-context
# prompt is refused with an Error frame naming the capability, rather than truncated to
# fit — a wrong answer from a silently shortened prompt is worse than no answer.
compose = []

# Continuous batching: the pure multi-sequence scheduler and its llama-bound driver
# (src/batch/). Nothing calls the driver today — see src/batch/README.md — so turning
# this off changes no behaviour, only what compiles. The scheduler stays well tested
# either way.
batch = []

# MoE expert offload: the expert_order loader, the FFI to the C driver, and the
# llama.cpp graph seam. Turn it off and JADE_MOE_DRIVER=1 fails the load instead of
# being ignored.
#
# This is the feature that shows why capabilities and llama.cpp bundles are one
# mechanism: enabling it also enables the sys crate's `bundle-moe`, which applies this
# capability's patch series to a staged copy of stock upstream llama.cpp. Rust half and
# C++ seam move together, behind one switch, so they cannot drift into a build that
# initialises a driver the graph never calls.
moe = ["llama-cpp-2/bundle-moe"]

[dependencies]
# `version` alongside `path` is not redundant: cargo checks the submodule's actual
# version against it, so rolling src/protocol back below the floor fails to resolve
# instead of failing to compile somewhere confusing. 0.5.0 is the floor because the
# provider ABI gained `ovata_provider_protocol_version` there, which packaging reads.
ovata-infer-protocol = { path = "src/protocol", version = ">=0.5.0" }
# Raw malloc/free for the Jade package boundary: the compiler frees the tree we
# return, and its allocator is libc's, not Rust's. See src/jade_pkg.rs.
libc = "0.2"
serde_json = { version = "1", features = ["std"] }
# The model profile capability (src/model/): TOML profiles compiled into the binary.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# The llama-bound halves of the capabilities are Linux-only: they link the vendored
# llama bindings. Gated so the pure halves still build and test on macOS.
#
# Default features are kept, and `common` in particular. It is ~2.2 MB we appear not to
# need — nothing here calls json_schema_to_grammar, FitError, or LlamaSampler::accept —
# but LlamaSampler::grammar is gated on it, and its C entry point is only compiled when
# it is on. Dropping it is a compile error at src/sample/chain.rs, not a size win. The
# measurement is in src/llama/bindings/README.md.
[target.'cfg(target_os = "linux")'.dependencies]
llama-cpp-2 = { path = "src/llama/bindings" }
llama-cpp-sys-2 = { path = "src/llama/bindings-sys" }
encoding_rs = "0.8"

# ── Workspace ─────────────────────────────────────────────────────────────────
[workspace]
# This package IS the workspace root, the way jadelang's is: `src/` holds the engine's
# capabilities as plain modules of this crate, and the handful of directories under it
# that are separate crates are members below — each for a reason stated where it sits.
#
# Everything you run rather than ship lives at the repo root: tools/ (Python),
# tests/ (the evals), ci/, docs/, dist/.
members = [
    # A git submodule with its own public repo, so the Jade language — which is public —
    # can depend on it too; a public repo cannot take a git dependency on this private
    # one. Both sides build the same definition.
    "src/protocol",
    # Ships as its own `.so`. A second cdylib needs a second package, and this one is
    # both the worked example for writing a native provider and the dlopen fixture
    # packaging validates against.
    "src/echo",
    # Vendored upstream identity, a build.rs that compiles llama.cpp from source, and a
    # sys/safe split that is upstream's own convention. Heavy: building these needs the
    # nested llama.cpp submodule plus cmake, so bare `cargo build --workspace` is a
    # Linux operation; on macOS use targeted `-p` builds.
    "src/llama/bindings",
    "src/llama/bindings-sys",
    # A build-dependency of the sys crate, and a member so `cargo test` runs its tests.
    # Build scripts are not testable, which is the whole reason it is not one.
    "src/llama/bundle-kit",
    # The xtask that builds and stages the others. As a module of this crate, the
    # engine would depend on its own packager.
    "src/packaging",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["JADE OS Contributors"]
license = "MIT"

# Shared deps for the llama bindings crates (they opt in via `{ workspace = true }`).
# Absorbed from the former llama-cpp sub-workspace when it was merged in.
[workspace.dependencies]
# core library deps
thiserror = "2"
tracing = "0.1"
tracing-core = "0.1"
# examples and benchmarks
hf-hub = { version = "0.5.0" }
criterion = "0.5.1"
pprof = "0.13.0"
bindgen = "0.72.1"
cc = "1.2.61"
anyhow = "1.0.102"
clap = "4.6.1"
encoding_rs = "0.8.35"
tracing-subscriber = { version = "0.3", features = ["json"] }

# Only the src/llama crates opt into these via `[lints] workspace = true`; the
# engine and provider crates don't reference workspace lints, so they're unaffected.
[workspace.lints.rust]
missing_docs = { level = "warn" }
missing_debug_implementations = { level = "warn" }

[workspace.lints.clippy]
pedantic = { level = "warn" }
