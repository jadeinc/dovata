[package]
name = "dovata"
version = "3.0.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "JADE OS model memory and inference layout planner, used by the Jade compiler at build time"

[lib]
name = "dovata"
path = "src/lib.rs"
# A plain Rust library. The Jade compiler is Rust and takes dovata as a cargo
# dependency, so there is no C ABI and no shared object to ship. 2.x was a cdylib
# loaded into running programs; 3.0 runs at build time and never executes a model.
crate-type = ["rlib"]

# `gguf-inspect` vets a model file — architecture, hparams, whether any profile matches
# — without llama.cpp, so it runs on a laptop before a GPU box ever sees the model. It
# is a bin of this package rather than its own crate because the reader it wraps is
# `src/gguf/`, a plain module of this library: `load/preflight.rs` is its only other
# caller, and a crate boundary between them bought nothing but a second manifest.
[[bin]]
name = "gguf-inspect"
path = "src/gguf/main.rs"

# ── Capabilities ──────────────────────────────────────────────────────────────
[features]
# Every capability is on by default, so a plain `cargo build` is the whole library.
# The features exist to make each capability's boundary explicit and checkable: if a
# capability can't be switched off, its edges aren't real.
default = ["moe"]

# MoE expert ranking: the `expert_order` loader that says which experts are hot. The
# planner will use it to decide which experts stay resident in VRAM.
moe = []

[dependencies]
serde_json = { version = "1", features = ["std"] }
# The model profile capability (src/model/): TOML profiles compiled into the binary.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# ── Workspace ─────────────────────────────────────────────────────────────────
[workspace]
# This package IS the workspace root, the way jadelang's is: `src/` holds the
# capabilities as plain modules of this crate, and the directories under it that are
# separate crates are members below, each for a reason stated where it sits.
members = [
    # The bindgen'd llama.cpp C API over the stock upstream submodule. Nothing links it
    # today; it stays for quantization, since `llama_model_quantize` is already
    # reachable through it, and as the reference for how ggml lays out tensors. Heavy:
    # building it needs the nested llama.cpp submodule plus cmake.
    "src/llama/bindings-sys",
    # A build-dependency of the sys crate, and a member so `cargo test` runs its tests.
    # Build scripts are not testable, which is the whole reason it is not one.
    "src/llama/bundle-kit",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["JADE OS Contributors"]
license = "MIT"

# Shared build deps for the llama sys crate, which opts in via `{ workspace = true }`.
[workspace.dependencies]
bindgen = "0.72.1"
cc = "1.2.61"

# Only the src/llama crates opt into these via `[lints] workspace = true`; the
# dovata crate itself doesn't reference workspace lints, so it is unaffected.
[workspace.lints.rust]
missing_docs = { level = "warn" }
missing_debug_implementations = { level = "warn" }

[workspace.lints.clippy]
pedantic = { level = "warn" }
