[workspace]
# src/ holds shipped software only: the crates, the protocol submodule, and the Jade
# provider packages. Everything you run rather than ship lives at the repo root —
# tools/ (Python), tests/ (the evals), ci/, docs/, dist/.
members = [
    # The wire protocol lives in its own public repo (git submodule at src/protocol/)
    # so the Jade language, which is public, can depend on it too — a public repo
    # cannot take a git dependency on this private one. Both sides build the same definition.
    "src/protocol",
    # The inference engine: the llama.cpp backend plus the pure core and the folded-in
    # model-profile module. Ships as a cdylib a Jade program dlopens. The Linux engine
    # is cfg-gated; the pure half builds on any platform.
    "src/dovata",
    # Remote-API providers (anthropic, openai) are pure-Jade libraries that call
    # their HTTP APIs directly (see src/anthropic/anthropic.jde, src/openai/openai.jde),
    # so they are not workspace members. `echo` is the reference native provider and
    # the dlopen fixture the packaging step validates against.
    "src/echo",
    # The inference engine — the vendored/forked llama.cpp bindings, now first-class
    # members of the one workspace (single lockfile, editable). Heavy: building these
    # needs the nested src/infer-engine/ffi/llama.cpp submodule + cmake, so bare
    # `cargo build --workspace` is a Linux operation; on macOS use targeted `-p` builds.
    "src/infer-engine/api",
    "src/infer-engine/ffi",
    # Build/packaging xtask: assembles the provider .so bundles into dist/.
    "src/packaging",
    # GGUF header tooling: reads a model file's metadata without llama.cpp, so a model
    # can be vetted on a laptop (or over a range request) before a GPU box ever sees it.
    "src/gguf",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["JADE OS Contributors"]
license = "MIT"

# Shared deps for the infer-engine crates (api/ffi opt in via `{ workspace = true }`).
# Absorbed from the former infer-engine (llama-cpp) sub-workspace when it was merged in.
[workspace.dependencies]
# core library deps
thiserror = "2"
tracing = "0.1"
tracing-core = "0.1"
# examples and benchmarks
hf-hub = { version = "0.5.0" }
criterion = "0.5.1"
pprof = "0.13.0"
bindgen = "0.72.1"
cc = "1.2.61"
anyhow = "1.0.102"
clap = "4.6.1"
encoding_rs = "0.8.35"
tracing-subscriber = { version = "0.3", features = ["json"] }

# Only the infer-engine crates opt into these via `[lints] workspace = true`; the
# daemon/provider crates don't reference workspace lints, so they're unaffected.
[workspace.lints.rust]
missing_docs = { level = "warn" }
missing_debug_implementations = { level = "warn" }

[workspace.lints.clippy]
pedantic = { level = "warn" }
